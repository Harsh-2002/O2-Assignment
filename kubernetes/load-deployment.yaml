apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector
  namespace: observability
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      # Vector generates data and does not need Kubernetes API access.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: vector
        image: timberio/vector:0.49.0-debian
        args:
        - --config
        - /etc/vector/vector.yaml
        env:
        - name: O2_USERNAME
          valueFrom:
            secretKeyRef:
              name: openobserve
              key: username
        - name: O2_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openobserve
              key: password
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - name: metrics
          containerPort: 9598
        # Listener readiness does not prove successful cloud ingestion.
        readinessProbe:
          tcpSocket:
            port: metrics
          initialDelaySeconds: 5
        livenessProbe:
          tcpSocket:
            port: metrics
          initialDelaySeconds: 30
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /etc/vector
          readOnly: true
        - name: data
          mountPath: /var/lib/vector
      volumes:
      - name: config
        configMap:
          name: vector-config
      # Temporary writable storage for the read-only container filesystem.
      - name: data
        emptyDir:
          sizeLimit: 1Gi
